<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOSJA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #222}
.logo{font-weight:900;letter-spacing:2px;font-size:22px}
.logo span{color:#a855f7}
.pill{font-size:11px;border:1px solid #333;padding:5px 10px;border-radius:999px;color:#aaa}
.controls{padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap}
select,button{border-radius:999px;border:1px solid #333;background:#16161d;color:#fff;padding:9px 14px;font-size:13px}
select{outline:none}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 14px;border-radius:18px;line-height:1.5;font-size:15px;white-space:pre-wrap}
.user{align-self:flex-end;background:#a855f7;color:#fff;border-bottom-right-radius:6px}
.bot{align-self:flex-start;background:#1c1c26;border:1px solid #2a2a35;border-bottom-left-radius:6px}
.inputbar{padding:12px;display:flex;gap:8px;border-top:1px solid #222;background:#0a0a0f}
#pergunta{flex:1;background:#16161d;border:1px solid #333;color:#fff;border-radius:999px;padding:13px 16px;outline:none;font-size:15px}
#enviar{background:#a855f7;border:none;color:#fff;padding:0 20px;border-radius:999px;font-weight:700}
.typing{opacity:.6;font-size:13px}
</style>
</head>
<body>
<header><div class="logo">FOS<span>JA</span></div><div class="pill">REDE NEURAL REAL</div></header>
<div class="controls">
<select id="idioma"><option value="pt">Português</option><option value="es">Español</option></select>
<select id="modo"><option value="livre">Livre</option><option value="avancado">Avançado</option><option value="modelos">Modelos</option></select>
</div>
<div id="chat"></div>
<div class="inputbar"><input id="pergunta" placeholder="Fala com a FOSJA..." autocomplete="off"><button id="enviar">Enviar</button></div>
<script>
const chat=document.getElementById("chat");
const input=document.getElementById("pergunta");
const btn=document.getElementById("enviar");
function add(texto,classe){const d=document.createElement("div");d.className="msg "+classe;d.textContent=texto;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
async function enviar(){
const texto=input.value.trim();if(!texto)return;
add(texto,"user");input.value="";
const idioma=document.getElementById("idioma").value;
const modo=document.getElementById("modo").value;
const bot=add("...","bot");
const res=await fetch(`/chat?pergunta=${encodeURIComponent(texto)}&idioma=${idioma}&modo=${modo}`);
const reader=res.body.getReader();const dec=new TextDecoder();let buf="";let final="";
while(true){const {done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});let parts=buf.split("\n\n");buf=parts.pop();for(const p of parts){if(!p.startsWith("data:"))continue;const data=p.replace("data:","").trim();if(data==="[FIM]")continue;try{const j=JSON.parse(data);if(j.texto){final+=j.texto;bot.textContent=final;chat.scrollTop=chat.scrollHeight;}}catch(e){}}}
if(!final.trim())bot.textContent="...";
}
btn.onclick=enviar;
input.addEventListener("keydown",e=>{if(e.key==="Enter")enviar();});
add("Oi, sou a FOSJA. Fala comigo que eu gero na hora.","bot");
</script>
</body>
</html>
